<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dəvətnamə</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Corinthia:wght@400;700&display=swap" rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
  <style>
    /* =====================================
       1. BAZA VƏ MOBİL STİLLER
    ===================================== */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background: #f5f0e9;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
      perspective: 1200px; /* Stabil 3D dərinlik hiss etdirmək üçün */
    }

    .invitation-card {
      width: 100%;
      min-height: 100dvh;
      margin: 0 auto;
      background: #fff;
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* =====================================
       2. AÇILIŞ EKRANI VƏ VİDEO
    ===================================== */
    #opening-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      background: #f5f0e9;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 1;
      visibility: visible;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #opening-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    #invitation {
      width: 100%;
      max-width: 430px;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      user-select: none;
      transition: transform 1s ease-out, opacity 0.5s ease;
    }

    #opening-video {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =====================================
       3. HERO SECTION (Əsas Səhifə)
    ===================================== */
    #main-invitation {
      width: 100%;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #main-invitation.fade-in {
      display: block;
      opacity: 1;
    }

    .hero-section {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hero-background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 178, 0, 0.2);
    }

    /* Hero İçerik və Şəffaf Mövzu */
    .hero-content.image-style-theme {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px 15px 15px;
      text-align: center;
      color: #6d4c1b;
    }

    .outer-gold-border {
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(181, 142, 80, 0.45);
      pointer-events: none;
      z-index: 1;
    }

    .hero-top {
      position: relative;
      z-index: 2;
      margin-top: 5px;
    }

    .getting-married {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.35em;
      color: #5c3e10;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .top-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .ornament-line {
      width: 25px;
      height: 1px;
      background: rgba(181, 142, 80, 0.5);
    }

    .ornament-icon {
      font-size: 8px;
      color: #a37c3f;
    }

    .names {
      font-weight: normal;
      line-height: 1;
      margin: 0;
    }

    .name {
      display: block;
      font-family: 'Alex Brush', cursive;
      font-size: clamp(45px, 12vw, 65px);
      color: #7a551e;
      text-shadow: 0px 1px 2px rgba(255, 255, 255, 0.8);
    }

    .ampersand {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-style: italic;
      color: #8c6a32;
      margin: -8px 0;
    }

    /* Ortadakı Sitat Bloku */
    .quote-box {
      margin: 6px auto 0;
      padding: 6px 10px;
      width: fit-content;
      border: 1px solid rgba(196, 194, 192, 0.35);
      background: rgba(196, 194, 192, 0.35);
      backdrop-filter: blur(3px);
    }

    .quote-box p {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      letter-spacing: 0.18em;
      line-height: 1.5;
      color: #4a320c;
      font-weight: 600;
    }

    .heart-icon {
      display: block;
      font-size: 8px;
      color: #a37c3f;
      margin-top: 2px;
    }

    /* Tarix Hissəsi (Nizamlanmış) */
    .hero-bottom {
      position: relative;
      z-index: 2;
      margin-bottom: 5px;
      background: transparent !important;
      box-shadow: none !important;
    }

    .date-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    .date-container>*{
      font-size: 20px !important;
    }

    .date-side {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: #4a320c;
      font-weight: 600;
    }

    .date-divider {
      width: 1px;
      height: 18px;
      background: rgba(181, 142, 80, 0.5);
    }

    .date-main {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 600;
      color: #4a320c;
      line-height: 1;
    }

    .waiting-text {
      font-family: 'Alex Brush', cursive;
      font-size: 26px;
      color: #5c3e10;
      margin-top: 0;
    }

    .decorative-heart {
      font-size: 11px;
      color: #a37c3f;
      margin: -4px 0 4px;
    }

    .info-footer {
      font-family: 'Cinzel', serif;
      color: #4a320c;
    }

    .time-location {
      font-size: 9px;
      letter-spacing: 0.2em;
      font-weight: 600;
    }

    .sub-info {
      font-size: 6.5px;
      letter-spacing: 0.12em;
      opacity: 0.85;
      margin-top: 2px;
    }

    /* Parıldayan RSVP Düyməsi */
    @keyframes glow {
      from {
        opacity: 0.4;
        text-shadow: 0 0 2px #fff, 0 0 5px #ffb300;
      }
      to {
        opacity: 1;
        text-shadow: 0 0 8px #fff, 0 0 15px #ffb300, 0 0 25px #ff8f00;
      }
    }

    .glow-text {
      font-size: 13px;
      color: #fff;
      text-align: center;
      animation: glow 1.8s ease-in-out infinite alternate;
    }

    .rsvp-button {
      position: relative;
      z-index: 10;
      width: 100%;
      border: 0;
      background: transparent;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding-bottom: clamp(15px, 4vh, 25px);
      cursor: pointer;
    }

    .arrow {
      font-size: 18px;
      animation: arrowMove 1.5s infinite ease-in-out;
    }

    @keyframes arrowMove {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }

    /* RSVP Bölməsi */
    #rsvp-section {
      min-height: 100dvh;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    /* Desktop Düzeni */
    @media (min-width: 601px) {
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .invitation-card {
        max-width: 430px;
        height: 100vh;
        max-height: 930px;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }

      #opening-screen {
        position: absolute;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="invitation-card">

    <!-- 1. AÇILIŞ EKRANI -->
    <div id="opening-screen">
      <img id="invitation" src="/acilmamis_devetname.png" alt="Dəvətnaməni aç" draggable="false">
      <video id="opening-video" playsinline webkit-playsinline preload="auto" muted disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback">
        <source src="/presentational-3%20kopyası.mov" type="video/mp4">
      </video>
    </div>

    <!-- 2. ƏSAS DƏVƏTNAMƏ -->
    <main id="main-invitation">
      
      <section class="hero-section">
        <div class="hero-background">
          <video autoplay loop muted playsinline webkit-playsinline preload="auto" src="/hero-video-BkP1eoiB.mp4"></video>
          <div class="hero-overlay"></div>
        </div>

        <div class="hero-content image-style-theme">
          <div class="outer-gold-border"></div>

          <!-- Yuxarı Hissə -->
          <div class="hero-top">
            <p class="getting-married">TOYUMUZA DƏVƏTLİSİNİZ</p>
            <div class="top-ornament">
              <span class="ornament-line"></span>
              <span class="ornament-icon">🕃 ✦ 🕄</span>
              <span class="ornament-line"></span>
            </div>

            <h1 class="names">
              <span class="name">Asim</span>
              <span class="ampersand">&amp;</span>
              <span class="name">Sevinc</span>
            </h1>

          </div>

          <!-- Aşağı Hissə (Tarix və Məlumat) -->
          <div class="hero-bottom quote-box">
            <div class="date-container">
              <span class="date-side">12</span>
              <span class="date-divider"></span>
              <span class="date-side">SENTYABR</span>
              <span class="date-divider"></span>
              <span class="date-side">2026</span>
            </div>

            <p class="waiting-text">Sizi gözləyirik!</p>
            <div class="decorative-heart">❦</div>

            <div class="info-footer">
              <p class="time-location">S A A T &nbsp;|&nbsp; M Ə K A N</p>
            </div>
          </div>

        </div>

        <button class="rsvp-button" type="button" onclick="scrollToRSVP()">
          <span class="glow-text">Aşağı sürüşdürün</span>
          <span class="arrow">↓</span>
        </button>
      </section>

      <!-- RSVP Bölməsi -->
      <section id="rsvp-section">
        <p style="font-size:12px; letter-spacing:0.3em; text-transform:uppercase; color:#777; margin-bottom:16px;">
          RSVP
        </p>
        <h2 style="font-size:clamp(28px, 8vw, 42px); font-weight:normal; color:#6d3b43; margin:0 0 16px;">
          Sizi gözləyirik
        </h2>
        <p style="max-width:320px; font-size:16px; line-height:1.7; color:#555; margin:0;">
          Həyatımızın ən gözəl və unudulmaz başlanğıcında sevincimizi sizinlə bölüşmək bizim üçün ən böyük dəyərdir.
        </p>
      </section>

    </main>
  </div>

  <script>
    const invitation = document.getElementById("invitation");
    const openingScreen = document.getElementById("opening-screen");
    const openingVideo = document.getElementById("opening-video");
    const mainInvitation = document.getElementById("main-invitation");
    const card = document.querySelector('.invitation-card');

    invitation.addEventListener("click", function() {
      openVideo();
      enableGyroscope();
    });

    function openVideo() {
      invitation.style.display = "none";
      openingVideo.style.display = "block";
      openingVideo.currentTime = 0;
      openingVideo.playbackRate = 2;

      openingVideo.play().catch(function(error) {
        console.log("Video autoplay problemi:", error);
      });
    }

    openingVideo.addEventListener("ended", function() {
      mainInvitation.style.display = "block";
      
      const nameElements = document.querySelectorAll(".name");
      nameElements.forEach(nameEl => {
        nameEl.classList.add("animate__animated", "animate__backInDown");
      });

      setTimeout(() => {
        mainInvitation.classList.add("fade-in");
      }, 20);

      openingScreen.classList.add("fade-out");

      window.scrollTo({
        top: 0,
        left: 0,
        behavior: "instant"
      });

      setTimeout(() => {
        openingVideo.pause();
        openingScreen.style.display = "none";
      }, 1000);
    });

    function scrollToRSVP() {
      document.getElementById("rsvp-section").scrollIntoView({
        behavior: "smooth"
      });
    }

    /* =======================================================
       STABİL 3D FİRANMA VƏ LERP (INTERPOLATION) SİSTEMİ
    ======================================================= */
    let targetRotateX = 0;
    let targetRotateY = 0;
    let currentRotateX = 0;
    let currentRotateY = 0;

    let initialBeta = null;
    let initialGamma = null;

    function handleOrientation(event) {
      const beta = event.beta;   // X-oxu (yuxarı-aşağı) [-180, 180]
      const gamma = event.gamma; // Y-oxu (sağ-sol) [-90, 90]

      if (beta === null || gamma === null) return;

      // İlk oxunan mövqeyi sıfır baza nöqtəsi olaraq qeyd edirik
      if (initialBeta === null || initialGamma === null) {
        initialBeta = beta;
        initialGamma = gamma;
      }

      // Başlanğıc mövqeyə nisbətən kənara çıxma dərəcəsini tapırıq
      let deltaX = beta - initialBeta;
      let deltaY = gamma - initialGamma;

      // Hərəkət bucağını maksimal ±15 dərəcə ilə məhdudlaşdırırıq (Həddindən artıq fırlanmanın qarşısını almaq üçün)
      targetRotateX = Math.max(-15, Math.min(15, -deltaX * 0.2));
      targetRotateY = Math.max(-15, Math.min(15, deltaY * 0.2));
    }

    // Animasiya Çərçivəsi (Render Loop) - Kəskin hərəkətləri hamarlayır
    function updateCardTransform() {
      // Lerp (Linear Interpolation) formulu: current + (target - current) * factor
      // 0.08 faktoru vizual olaraq çox hamar və stabil bir sürüşmə verir
      currentRotateX += (targetRotateX - currentRotateX) * 0.04;
      currentRotateY += (targetRotateY - currentRotateY) * 0.04;

      if (card) {
        card.style.transform = `rotateX(${currentRotateX.toFixed(2)}deg) rotateY(${currentRotateY.toFixed(2)}deg)`;
      }

      requestAnimationFrame(updateCardTransform);
    }

    function enableGyroscope() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              requestAnimationFrame(updateCardTransform);
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        requestAnimationFrame(updateCardTransform);
      }
    }
  </script>

</body>
</html>
